name: Build Bracket Builder iPhone App

# Same pattern as SetMetric: a hosted Mac compiles the app and publishes an
# UNSIGNED .ipa that Sideloadly signs on Windows with your own Apple ID.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iphone.yml'
      - 'client/**'
      - 'shared/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bracket-builder-iphone-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '1.0'
  BUNDLE_ID: com.lazykode.bracketbuilder

jobs:
  checks:
    name: Type-check and bracket simulations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run check
      - name: Play ~1,400 simulated tournaments
        run: npm run simulate

  iphone:
    name: iPhone IPA (Windows / Sideloadly)
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the offline app (no server needed)
        run: npm run build:app
      - name: Generate native iPhone project
        run: npx cap add ios
      - name: App icon and launch screen
        # Cosmetic only: if this tool fails the app still builds with the default icon.
        run: npx --yes @capacitor/assets@4.0.0 generate --ios || echo '::warning::Could not generate the app icon; using the default one.'
      - name: Camera permission text (athlete photos)
        shell: bash
        run: |
          set -euo pipefail
          PLIST=ios/App/App/Info.plist
          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :NSCameraUsageDescription string Take a photo of an athlete for the bracket.' "$PLIST" \
            || /usr/libexec/PlistBuddy -c 'Set :NSCameraUsageDescription Take a photo of an athlete for the bracket.' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' "$PLIST" || true
      - name: Copy the app into the iPhone project
        run: npx cap sync ios
      - name: Compile iPhone device app without Apple signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d ios/App/App.xcworkspace ]]; then
            TARGET=(-workspace ios/App/App.xcworkspace)
          else
            TARGET=(-project ios/App/App.xcodeproj)
          fi
          # Version shown in iOS Settings: APP_VERSION (build = workflow run number).
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${APP_VERSION};/; s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/" ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -list "${TARGET[@]}"
          echo "Building ${TARGET[*]} (scheme App)"
          xcodebuild \
            "${TARGET[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build > ios-xcodebuild.log 2>&1 || { tail -n 200 ios-xcodebuild.log; exit 1; }
          tail -n 5 ios-xcodebuild.log
      - name: Package unsigned IPA for Sideloadly on Windows
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$PWD/ios-derived-data/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo '::error::iPhone .app not found after xcodebuild.'
            exit 1
          fi
          # The web app must be inside the bundle, otherwise the app would open blank.
          test -f "$APP_PATH/public/index.html"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/BracketBuilder-iPhone-unsigned.ipa" Payload)
          unzip -t BracketBuilder-iPhone-unsigned.ipa | tail -n 2
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -qx "$BUNDLE_ID"
          (cd "$APP_PATH" && /usr/bin/lipo -archs "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Info.plist)" | grep -qw arm64)
          shasum -a 256 BracketBuilder-iPhone-unsigned.ipa > IPA-SHA256.txt
          cat > IPHONE-INSTALL-NOTES.txt <<NOTES
          Bracket Builder iPhone - UNSIGNED IPA for Sideloadly on Windows
          Version $APP_VERSION (build ${{ github.run_number }}), device build: arm64, iOS 15 or later.
          Sideloadly signs this IPA using your own Apple ID.
          Not an App Store IPA; it cannot be installed by tapping the file.
          Bundle identifier: $BUNDLE_ID
          Works fully offline. Tournaments are stored on the phone:
          always sign updates with the SAME Apple ID and do not delete the old app first,
          and use "On this device > Save a backup file" after each event.
          NOTES
          ls -lh BracketBuilder-iPhone-unsigned.ipa
      - name: Publish iPhone artifact
        uses: actions/upload-artifact@v4
        with:
          name: BracketBuilder-iPhone-for-Windows
          path: |
            BracketBuilder-iPhone-unsigned.ipa
            IPHONE-INSTALL-NOTES.txt
            IPA-SHA256.txt
          retention-days: 30
          if-no-files-found: error
      - name: Keep Xcode log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BracketBuilder-iPhone-build-log
          path: ios-xcodebuild.log
          if-no-files-found: ignore
